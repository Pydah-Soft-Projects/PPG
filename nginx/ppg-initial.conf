# ==============================================================================
# Initial HTTP-Only Nginx Configuration (Use before obtaining SSL via Certbot)
#
# Steps:
#   1. Copy to conf.d:    sudo cp /home/ec2-user/PPG/nginx/ppg-initial.conf /etc/nginx/conf.d/ppg.conf
#   2. Test syntax:       sudo nginx -t
#   3. Reload nginx:      sudo systemctl reload nginx
#   4. Run Certbot:       sudo certbot --nginx -d ppg.pydah.edu.in -d ppg-backend.pydah.edu.in
#      (Certbot will automatically obtain certificates and configure HTTPS in /etc/nginx/conf.d/ppg.conf)
# ==============================================================================

# 1. FRONTEND: ppg.pydah.edu.in
server {
    listen 80;
    listen [::]:80;
    server_name ppg.pydah.edu.in;

    root /var/www/ppg;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

# 2. BACKEND: ppg-backend.pydah.edu.in
server {
    listen 80;
    listen [::]:80;
    server_name ppg-backend.pydah.edu.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

