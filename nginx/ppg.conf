# ==============================================================================
# Nginx Configuration for Pydah Payment Gateway (PPG)
#
# Domains:
#   - Frontend Dashboard: ppg.pydah.edu.in        -> /var/www/ppg
#   - Backend API/Gateway: ppg-backend.pydah.edu.in -> http://127.0.0.1:5005
#
# Installation on Ubuntu / Lightsail:
#   1. Copy this file to: /etc/nginx/sites-available/ppg.conf
#   2. Create symlink:    sudo ln -s /etc/nginx/sites-available/ppg.conf /etc/nginx/sites-enabled/
#   3. Test syntax:       sudo nginx -t
#   4. Obtain SSL certs:  sudo certbot --nginx -d ppg.pydah.edu.in -d ppg-backend.pydah.edu.in
#   5. Reload nginx:      sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND: ppg.pydah.edu.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ppg.pydah.edu.in;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ppg.pydah.edu.in;

    root /var/www/ppg;
    index index.html;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/ppg.pydah.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppg.pydah.edu.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Single Page Application routing (Vite React app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (Vite hashed bundles: js, css, images, fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html so user always gets the latest deployed bundle
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Optional same-origin proxy to backend API (if needed)
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host ppg-backend.pydah.edu.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKEND API & CHECKOUT: ppg-backend.pydah.edu.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ppg-backend.pydah.edu.in;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ppg-backend.pydah.edu.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/ppg-backend.pydah.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppg-backend.pydah.edu.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large payloads (e.g. webhook events, receipts, audit reports)
    client_max_body_size 25M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy to Node.js / Express backend
    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for external gateway processing (Razorpay, Cashfree, MySQL RDS queries)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings for fast webhook and redirect processing
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Hosted Checkout endpoint (allows iframe embedding from college portals)
    location /checkout/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow iframe rendering inside client portals (e.g. Student Portal)
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "ALLOWALL" always;
    }

    # Drop-in SDK script (/sdk/ppg.js)
    location /sdk/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache SDK script for 1 hour while allowing cross-origin script tags
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }
}

